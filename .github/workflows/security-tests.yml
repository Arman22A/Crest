name: Security tests

on:
  pull_request:
  push:
    branches: [main, security-foundation]

permissions:
  contents: read

jobs:
  client-and-edge-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --check script.js
      - run: node --check sw.js
      - run: node --experimental-strip-types --test tests/*.test.mjs

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.115.0
      - run: supabase start
      - run: supabase test db
